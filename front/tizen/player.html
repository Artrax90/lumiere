<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920,initial-scale=1,user-scalable=no">
  <title>Lumiere Player</title>
  <link rel="stylesheet" href="/tv/player.css?v=550">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
</head>
<body>
  <div id="player">
    <video id="video" playsinline></video>

    <!-- OSD -->
    <div id="osd">
      <!-- Top bar -->
      <div id="osd-top">
        <div class="osd-top-left">
          <button id="btn-back" class="osd-btn osd-top-btn" data-btn="back" tabindex="0">← Назад</button>
          <div id="osd-title-wrap">
            <div id="osd-title"></div>
            <div id="osd-stats" class="osd-stats">
              <span id="osd-res-badge" class="osd-badge">1080p</span>
              <span id="osd-peers" class="osd-stat-text">-- / -- • -- подкл.</span>
              <span id="osd-speed" class="osd-stat-speed">-- Мбит/с</span>
              <div class="osd-buffer-wrap">
                <span id="osd-buffer-text" class="osd-buffer-text">Буфер: --%</span>
                <div id="osd-dots" class="osd-dots">
                  <span class="osd-dot"></span><span class="osd-dot"></span><span class="osd-dot"></span><span class="osd-dot"></span><span class="osd-dot"></span>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="osd-top-right">
          <button id="btn-audio" class="osd-btn osd-top-btn" data-btn="audio" tabindex="0">🔊 Звук</button>
          <button id="btn-cc" class="osd-btn osd-top-btn" data-btn="cc" tabindex="0">💬 Субтитры</button>
        </div>
      </div>

      <!-- Center Action Flash Indicator -->
      <div id="center-indicator">
        <span id="center-indicator-icon">▶</span>
        <span id="center-indicator-text">Воспроизведение</span>
      </div>

      <!-- Bottom Controls -->
      <div id="osd-bottom">
        <div id="timeline-row">
          <span id="time-current">0:00</span>
          <div id="timeline-wrap" tabindex="0">
            <div id="timeline-bar">
              <div id="timeline-buffer"></div>
              <div id="timeline-fill"></div>
              <div id="timeline-thumb"></div>
            </div>
          </div>
          <span id="time-total">0:00</span>
        </div>
        <div class="osd-hint-row">
          <div class="osd-hint-item"><span class="osd-hint-key">OK</span> Пауза / Пуск</div>
          <div class="osd-hint-item"><span class="osd-hint-key">◄ / ►</span> Перемотка 10с</div>
          <div class="osd-hint-item"><span class="osd-hint-key">▲</span> Меню плеера</div>
          <div class="osd-hint-item"><span class="osd-hint-key">▼</span> Скрыть меню</div>
          <div class="osd-hint-item"><span class="osd-hint-key">Назад</span> Выход</div>
        </div>
      </div>
    </div>

    <!-- Popup Track Chooser -->
    <div id="popup" class="hidden">
      <div id="popup-header"></div>
      <div id="popup-list"></div>
    </div>

    <!-- Subtitle Overlay -->
    <div id="subtitle-overlay"></div>
  </div>

  <script src="/tv/player-adapter.js?v=550"></script>
  <script src="/tv/player.js?v=550"></script>
</body>
</html>
