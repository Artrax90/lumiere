<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920,initial-scale=1,user-scalable=no">
  <title>Lumiere Player v500</title>
  <link rel="stylesheet" href="/tv/player.css?v=500">
  <!-- Samsung AVPlay API — must be loaded before player-adapter.js -->
  <script src="$WEBAPIS/webapis/webapis.js"></script>
</head>
<body>
  <div id="player">
    <video id="video" playsinline></video>

    <!-- OSD -->
    <div id="osd">
      <!-- Top bar -->
      <div id="osd-top">
        <button id="btn-back" class="osd-btn" tabindex="0">← Назад</button>
        <div id="osd-title-wrap">
          <div id="osd-title"></div>
        </div>
      </div>

      <!-- Center play icon -->
      <div id="center-play" class="hidden">
        <div id="center-play-icon">▶</div>
      </div>

      <!-- Bottom -->
      <div id="osd-bottom">
        <!-- Timeline row -->
        <div id="timeline-row">
          <span id="time-current">0:00</span>
          <div id="timeline-wrap" tabindex="0">
            <div id="timeline-bar">
              <div id="timeline-buffer"></div>
              <div id="timeline-fill"></div>
              <div id="timeline-thumb"></div>
            </div>
          </div>
          <span id="time-total">0:00</span>
        </div>

        <!-- Transport buttons -->
        <div id="controls-transport">
          <button id="btn-start" class="osd-btn osd-btn-round" tabindex="0">⏮</button>
          <button id="btn-rew" class="osd-btn osd-btn-round" tabindex="0">⏪</button>
          <button id="btn-play" class="osd-btn osd-btn-play" tabindex="0">❚❚</button>
          <button id="btn-fwd" class="osd-btn osd-btn-round" tabindex="0">⏩</button>
          <button id="btn-end" class="osd-btn osd-btn-round" tabindex="0">⏭</button>
        </div>

        <!-- Action buttons -->
        <div id="controls-actions">
          <button id="btn-cc" class="osd-btn osd-btn-action" tabindex="0">Субтитры</button>
          <button id="btn-audio" class="osd-btn osd-btn-action" tabindex="0">Аудио</button>
          <button id="btn-speed" class="osd-btn osd-btn-action" tabindex="0">Скорость</button>
          <button id="btn-settings" class="osd-btn osd-btn-action" tabindex="0">Настройки</button>
        </div>
      </div>
    </div>

    <!-- Popup menu -->
    <div id="popup" class="hidden">
      <div id="popup-header"></div>
      <div id="popup-list"></div>
    </div>

    <!-- Subtitle overlay -->
    <div id="subtitle-overlay"></div>
  </div>
  <script src="/tv/player-adapter.js?v=500"></script>
  <script src="/tv/player.js?v=500"></script>
</body>
</html>
