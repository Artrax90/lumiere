<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920,initial-scale=1,user-scalable=no">
  <title>Lumiere Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: black; overflow: hidden; width: 1920px; height: 1080px; }
    #player { position: fixed; inset: 0; }
    #video { width: 100%; height: 100%; object-fit: contain; display: none; }
    #player-osd {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 20px 24px;
      background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, transparent 100%);
      opacity: 1; transition: opacity 0.3s;
    }
    #player-title { font-size: 18px; font-weight: 500; color: #e6e8ee; margin-bottom: 10px; }
    #player-progress { display: flex; align-items: center; gap: 12px; }
    #player-bar { flex: 1; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; overflow: hidden; }
    #player-fill { height: 100%; background: #6ee7b7; border-radius: 2px; width: 0%; }
    #player-time { font-size: 13px; color: rgba(255,255,255,0.6); }
    #player-hint { margin-top: 8px; font-size: 12px; color: rgba(255,255,255,0.3); }
  </style>
</head>
<body>
  <div id="player">
    <video id="video" playsinline></video>
    <div id="player-osd">
      <div id="player-title"></div>
      <div id="player-progress">
        <div id="player-bar"><div id="player-fill"></div></div>
        <span id="player-time">0:00 / 0:00</span>
      </div>
      <div id="player-hint">Enter: пауза | ←→: ±10с | ↑↓: ±60с | ←: назад</div>
    </div>
  </div>
  <script src="/tv/player.js"></script>
</body>
</html>
